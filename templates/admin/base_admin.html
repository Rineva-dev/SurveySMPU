<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_survey.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/table.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detail_survey.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
</head>
<body>

<!-- MODAL CUSTOM -->
<div id="customModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h3 id="modalTitle">Konfirmasi</h3>
        <p id="modalMessage"></p>

        <div class="modal-actions">
        <button id="modalCancel" class="btn-cancel">Batal</button>
        <button id="modalOk" class="btn-ok">OK</button>
        </div>
    </div>
</div>

<div class="sidebar">

    <div class="sidebar-header">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Sekolah">
    </div>

    <div class="sidebar-menu">

        <a href="/dashboard"
           class="menu-item {% if active_page == 'dashboard' %}active{% endif %}">
            <img src="{{ url_for('static', filename='img/dashboard.png') }}" class="menu-icon">
            <span>Dashboard</span>
        </a>

        <a href="/survey"
            class="menu-item {% if active_page == 'survey' %}active{% endif %}">
            <img src="{{ url_for('static', filename='img/survey.png') }}" class="menu-icon">
            <span>Survey</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <a href="/logout" class="logout-btn-modern">
            <i data-lucide="log-out"></i>
            <span>Logout</span>
        </a>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="admin-header">

    <!-- LEFT -->
    <div class="header-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
        </button>
        <div class="header-title-wrap">
            <div class="admin-main-title">
                Dashboard
            </div>

            <div class="admin-sub-title">
                <span class="dot"></span>
                Sistem Survey Sekolah
            </div>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="header-right">

        <!-- SEARCH -->
        <div class="header-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Cari...">
        </div>

        <!-- NOTIFICATION -->
        <button class="header-action-btn">
            <i data-lucide="bell"></i>
        </button>

        <!-- PROFILE -->
        <div class="admin-profile">
            <img src="{{ url_for('static', filename='img/profile.png') }}">
        </div>

    </div>

</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

<script>
    lucide.createIcons();
</script>
<script>

    lucide.createIcons();

    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    const menuBtn = document.getElementById("mobileMenuBtn");

    menuBtn.addEventListener("click", () => {
        sidebar.classList.add("show");
        overlay.classList.add("show");
    });

    overlay.addEventListener("click", () => {
        sidebar.classList.remove("show");
        overlay.classList.remove("show");
    });

</script>

<!-- GLOBAL LOADING OVERLAY -->
<div class="global-loading" id="globalLoading">
    <div class="loading-box">
        <div class="spinner"></div>
        <p>Memproses<span class="dots"></span></p>
    </div>
</div>

<script>
const loading = document.getElementById("globalLoading");

document.querySelectorAll("form").forEach(form => {
    form.addEventListener("submit", (e) => {

        if (form.classList.contains("confirm-delete")) {
            return;
        }

        loading.style.display = "flex";
    });
});

document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", (e) => {
        const href = link.getAttribute("href");

        if (
            href &&
            !href.startsWith("#") &&
            !link.classList.contains("no-loading")
        ) {
            loading.style.display = "flex";
        }
    });
});

function showModal({ title, message, onOk, onCancel }) {
    const modal = document.getElementById("customModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const btnOk = document.getElementById("modalOk");
    const btnCancel = document.getElementById("modalCancel");

    modalTitle.innerText = title;
    modalMessage.innerHTML = message;

    modal.classList.remove("hidden");

    btnOk.onclick = () => {
        modal.classList.add("hidden");
        onOk && onOk();
    };

    btnCancel.onclick = () => {
        modal.classList.add("hidden");
        onCancel && onCancel();
    };
}

function hideLoading() {
    const loading = document.getElementById("globalLoading");
    if (loading) {
        loading.style.display = "none";
    }
}

window.addEventListener("pageshow", function (event) {
    hideLoading();

    if (event.persisted) {
        hideLoading();
    }
});

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        hideLoading();
    }
});

</script>
</body>
</html>
