<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_survey.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/table.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detail_survey.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
</head>
<body>

<!-- MODAL CUSTOM -->
<div id="customModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h3 id="modalTitle">Konfirmasi</h3>
        <p id="modalMessage"></p>

        <div class="modal-actions">
        <button id="modalCancel" class="btn-cancel">Batal</button>
        <button id="modalOk" class="btn-ok">OK</button>
        </div>
    </div>
</div>

<div class="sidebar">

    <div class="sidebar-header">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Sekolah">
    </div>

    <div class="sidebar-menu">

        <a href="/dashboard"
           class="menu-item {% if active_page == 'dashboard' %}active{% endif %}">
            <img src="{{ url_for('static', filename='img/dashboard.png') }}" class="menu-icon">
            <span>Dashboard</span>
        </a>

        <a href="/survey"
            class="menu-item {% if active_page == 'survey' %}active{% endif %}">
            <img src="{{ url_for('static', filename='img/survey.png') }}" class="menu-icon">
            <span>Survey</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <a href="/logout" class="logout-btn-modern">
            <i data-lucide="log-out"></i>
            <span>Logout</span>
        </a>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="admin-header">

    <!-- LEFT -->
    <div class="header-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i data-lucide="menu"></i>
        </button>
        <div class="header-title-wrap">
            <div class="admin-main-title">
                Dashboard
            </div>

            <div class="admin-sub-title">
                <span class="dot"></span>
                Sistem Survey Sekolah
            </div>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="header-right">

        <!-- SEARCH -->
        <div class="header-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Cari...">
        </div>

        <!-- NOTIFICATION -->
        <div class="notification-wrapper">

            <button class="header-action-btn" id="notifBtn">

                <i data-lucide="bell"></i>

                <span class="notif-badge hidden"></span>

            </button>

            <div class="notif-dropdown hidden" id="notifDropdown">

                <div class="notif-header">
                    <span class="notif-title">Notifikasi</span>

                    <button id="clearAllNotif" class="clear-all-btn">
                        Clear All
                    </button>
                </div>

                <div id="notifList">
                    <div class="notif-empty">Memuat notifikasi...</div>
                </div>

            </div>

        </div>

        <!-- PROFILE -->
        <div class="admin-profile">
            <img src="{{ url_for('static', filename='img/profile.png') }}">
        </div>

    </div>

</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

<script>
    lucide.createIcons();
</script>
<script>

    lucide.createIcons();

    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    const menuBtn = document.getElementById("mobileMenuBtn");

    menuBtn.addEventListener("click", () => {
        sidebar.classList.add("show");
        overlay.classList.add("show");
    });

    overlay.addEventListener("click", () => {
        sidebar.classList.remove("show");
        overlay.classList.remove("show");
    });

</script>

<!-- GLOBAL LOADING OVERLAY -->
<div class="global-loading" id="globalLoading">
    <div class="loading-box">
        <div class="spinner"></div>
        <p>Memproses<span class="dots"></span></p>
    </div>
</div>

<script>
let lastNotifCount = 0;
console.log("NOTIF SCRIPT LOADED");
const loading = document.getElementById("globalLoading");

document.querySelectorAll("form").forEach(form => {
    form.addEventListener("submit", (e) => {

        if (form.classList.contains("confirm-delete")) {
            return;
        }

        loading.style.display = "flex";
    });
});

document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", (e) => {
        const href = link.getAttribute("href");

        if (
            href &&
            !href.startsWith("#") &&
            !link.classList.contains("no-loading")
        ) {
            loading.style.display = "flex";
        }
    });
});

function showModal({ title, message, onOk, onCancel }) {

    const modal = document.getElementById("customModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const btnOk = document.getElementById("modalOk");
    const btnCancel = document.getElementById("modalCancel");

    modalTitle.innerText = title;
    modalMessage.innerHTML = message;

    modal.classList.remove("hidden");

    btnOk.onclick = (e) => {

        e.stopPropagation();

        modal.classList.add("hidden");

        onOk && onOk();
    };

    btnCancel.onclick = (e) => {

        e.stopPropagation();

        modal.classList.add("hidden");

        onCancel && onCancel();
    };
}

const customModal = document.getElementById("customModal");

customModal.addEventListener("click", (e) => {
    e.stopPropagation();
});

document.querySelector(".modal-box")
    .addEventListener("click", (e) => {
        e.stopPropagation();
    });

function hideLoading() {
    const loading = document.getElementById("globalLoading");
    if (loading) {
        loading.style.display = "none";
    }
}

window.addEventListener("pageshow", function (event) {
    hideLoading();

    if (event.persisted) {
        hideLoading();
    }
});

async function refreshNotifBadge() {

    try {

        const res = await fetch("/admin/notifications/unread-count");
        const data = await res.json();

        const badge = document.querySelector(".notif-badge");

        if (!badge) return false;

        // cek apakah count berubah
        const changed = data.count !== lastNotifCount;

        lastNotifCount = data.count;

        if (data.count > 0) {

            badge.innerText = data.count;
            badge.classList.remove("hidden");

        } else {

            badge.classList.add("hidden");
        }

        return changed;

    } catch (err) {

        console.log("notif refresh gagal");
        return false;
    }
}

const notifBtn = document.getElementById("notifBtn");
const notifDropdown = document.getElementById("notifDropdown");

if (notifBtn && notifDropdown) {
    notifBtn.addEventListener("click", async (e) => {
        e.stopPropagation();

        notifDropdown.classList.toggle("hidden");

        if (!notifDropdown.classList.contains("hidden")) {
            await loadNotifications();

            await fetch("/admin/notifications/read", {
                method: "POST"
            });

            const badge = document.querySelector(".notif-badge");
            if (badge) {
                badge.innerText = "0";
                badge.classList.add("hidden");
            }

            // hapus status unread di UI
            document.querySelectorAll(".notif-item.unread")
                .forEach(el => el.classList.remove("unread"));
        }
    });
}

document.addEventListener("click", (e) => {

    // jangan tutup kalau klik modal
    if (e.target.closest(".modal-box")) {
        return;
    }

    notifDropdown.classList.add("hidden");
});

notifDropdown.addEventListener("click", (e) => {
    e.stopPropagation();
});

const clearBtn = document.getElementById("clearAllNotif");

clearBtn.addEventListener("click", () => {

    showModal({
        title: "Hapus Notifikasi",
        message: "Yakin ingin menghapus semua notifikasi?",
        
        onOk: async () => {

            const res = await fetch("/admin/notifications/clear", {
                method: "POST"
            });

            const data = await res.json();

            if (data.success) {

                const list = document.getElementById("notifList");

                list.innerHTML = `
                    <div class="notif-empty">
                        Tidak ada notifikasi
                    </div>
                `;

                const badge = document.querySelector(".notif-badge");
                if (badge) badge.remove();
            }
        },

        onCancel: () => {
            
        }
    });

});

document.addEventListener("click", async function (e) {

    const deleteBtn = e.target.closest(".notif-delete");

    if (!deleteBtn) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    const id = deleteBtn.dataset.id;

    showModal({
        title: "Hapus Notifikasi",
        message: "Apakah Anda yakin ingin menghapus notifikasi ini?",

        onOk: async () => {

            try {

                const res = await fetch(
                    `/admin/notifications/delete/${id}`,
                    {
                        method: "POST"
                    }
                );

                const data = await res.json();

                if (!data.success) return;

                const item = deleteBtn.closest(".notif-item");

                if (item) {

                    item.style.transition = "all .25s ease";
                    item.style.opacity = "0";
                    item.style.transform = "translateX(20px)";

                    setTimeout(() => {

                        item.remove();

                        const totalItems =
                            document.querySelectorAll(".notif-item").length;

                        if (totalItems === 0) {

                            document.getElementById("notifList").innerHTML = `
                                <div class="notif-empty">
                                    Tidak ada notifikasi
                                </div>
                            `;
                        }

                    }, 250);
                }

                await refreshNotifBadge();

            } catch (err) {

                console.log("Gagal menghapus notifikasi");
            }
        }
    });
}, true);

async function loadNotifications(forceRender = false) {

    const list = document.getElementById("notifList");

    const res = await fetch("/admin/notifikasi");
    const data = await res.json();

    // kosong
    if (data.length === 0) {

        if (forceRender || list.children.length !== 1) {
            list.innerHTML = `
                <div class="notif-empty">
                    Tidak ada notifikasi
                </div>
            `;
        }

        return;
    }

    // =========================
    // AMBIL ID TERBARU DI DOM
    // =========================

    const existingIds = Array.from(
        document.querySelectorAll(".notif-item")
    ).map(el => el.dataset.id);

    // =========================
    // TAMBAH HANYA NOTIF BARU
    // =========================

    data.reverse().forEach(n => {

        if (existingIds.includes(String(n.id))) {
            return;
        }

        const item = document.createElement("div");

        item.className = `notif-item ${n.is_read ? "" : "unread"}`;
        item.dataset.id = n.id;

        item.style.opacity = "0";
        item.style.transform = "translateY(-8px)";
        item.style.transition = "all .25s ease";

        item.innerHTML = `
            <div class="notif-body">
                <a href="${n.target_url || '#'}"
                    class="notif-message notif-link no-loading"
                    data-id="${n.id}">
                    ${n.message}
                </a>
            </div>

            <div class="notif-footer">
                <div class="notif-time">${n.time}</div>

                <button
                    class="notif-delete"
                    data-id="${n.id}"
                    onclick="event.stopPropagation()">
                    Delete
                </button>
            </div>
        `;

        // hapus empty state
        const empty = list.querySelector(".notif-empty");
        if (empty) empty.remove();

        // prepend notif baru
        list.prepend(item);

        requestAnimationFrame(() => {
            item.style.opacity = "1";
            item.style.transform = "translateY(0)";
        });
    });
}
document.addEventListener("click", async (e) => {
    const link = e.target.closest(".notif-link");
    if (!link) return;

    const id = link.dataset.id;
    if (!id) return;

    e.preventDefault();

    // tandai notif ini sudah dibaca
    await fetch(`/admin/notification/${id}`);

    // redirect manual
    window.location.href = link.href;
});

window.addEventListener("scroll", () => {
    if (window.innerWidth <= 768) {
        const dropdown = document.getElementById("notifDropdown");
        dropdown && dropdown.classList.add("hidden");
    }
});

let notifPolling = null;

function startNotifPolling() {

    if (notifPolling) return;

    notifPolling = setInterval(async () => {

        if (document.visibilityState !== "visible") {
            return;
        }

        // cek apakah count berubah
        const changed = await refreshNotifBadge();

        // reload notif HANYA jika berubah
        // dan dropdown sedang terbuka
        if (changed) {

            // update list realtime
            await loadNotifications();

        }


    }, 3000);
}

startNotifPolling();

// refresh pertama saat page load
(async () => {

    await refreshNotifBadge();

    // render notif awal
    await loadNotifications(true);

})();

</script>
</body>
</html>
