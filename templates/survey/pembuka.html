<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ survey.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/pembuka.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="page">

    <div class="card">

        <div class="school-brand">
            <img src="/static/img/logo3.png" alt="Logo Sekolah" class="school-logo">
        </div>

        <div class="badge">Sistem Survey Sekolah</div>

        <h1 class="title">{{ survey.title }}</h1>

        <div class="divider"></div>

        <div class="desc">
            {{ survey.description | safe }}
        </div>

        <div class="date-box">

            <div class="date-card">
                <div class="date-label">
                    Mulai Survey
                </div>

                <div class="date-value">
                    {{ format_date(survey.start_date) }}
                </div>
            </div>

            <div class="date-card">
                <div class="date-label">
                    Batas Akhir
                </div>

                <div class="date-value">
                    {{ format_date(survey.end_date) }}
                </div>
            </div>

        </div>

        <form method="POST" action="/survey/{{ survey.id }}/start">
            <button type="submit" class="btn">
                Mulai Survey
            </button>
        </form>

    </div>

</div>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loading">
    <div class="loading-box">
        <div class="spinner"></div>
        <p>Menyiapkan survey<span class="dots"></span></p>
    </div>
</div>

<script>
document.querySelector("form").addEventListener("submit", function () {
    document.getElementById("loading").style.display = "flex";

    // kunci tombol biar tidak double klik
    const btn = this.querySelector("button");
    if (btn) {
        btn.disabled = true;
        btn.style.opacity = "0.7";
    }
});
</script>
</body>
</html>
